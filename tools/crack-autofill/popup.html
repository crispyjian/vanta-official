<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VANTA · CRACK 자동입력</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;color:#eff3ff;background:#11151e;font-size:13px}
    body{margin:0;min-width:370px;width:410px;max-height:590px;overflow:auto}
    header{padding:20px 19px 12px;background:linear-gradient(120deg,#1d2d62,#121723 72%)}
    .tag{font-size:10px;letter-spacing:.23em;color:#bfd1ff;font-weight:700}
    h1{margin:7px 0 7px;font-size:22px;letter-spacing:-.04em}h1 b{color:#d4ff39}
    p{margin:0;font-size:12px;line-height:1.6;color:#bfc7d7}
    main{padding:16px 19px 20px}label{display:block;margin:0 0 6px;color:#dbe3f3;font-size:12px;font-weight:700}
    select,textarea,input{width:100%;box-sizing:border-box;border:1px solid #384056;border-radius:9px;color:#fff;background:#1b2231;padding:11px;font-family:inherit;font-size:13px}
    select{height:41px}.control{margin-bottom:14px}textarea{min-height:85px;resize:vertical;line-height:1.5}
    .field-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.count{font-weight:400;color:#8897b0;font-size:10px}
    .buttons{display:flex;gap:8px;margin-top:12px;align-items:center}button{padding:12px 14px;border:0;border-radius:10px;cursor:pointer;font-weight:700;font-family:inherit;font-size:12px}button.primary{flex:1;color:#0d151d;background:#d4ff39}button.secondary{color:#f6f7fc;background:#303b52}
    .hint{border:1px solid #384056;background:#181e2b;border-radius:10px;padding:11px;line-height:1.6;color:#afbdd6;font-size:11px;margin-top:14px}
    #status{min-height:22px;margin-top:11px;white-space:pre-wrap;color:#d4ff39;font-size:12px;line-height:1.55}
    #status.error{color:#ffb1b1}.toprow{display:flex;gap:10px}.toprow .control{flex:1}
    a{color:#c9d6ff}hr{border:0;border-top:1px solid #2b3446;margin:12px 0 17px}
  </style>
</head>
<body>
<header><div class="tag">VANTA! × CRACK</div><h1>STORY <b>AUTOFILL.</b></h1><p>스토리 제작 페이지에서 필요한 칸을 자동으로 채워줘.<br>게시·공개는 지안이가 직접 확인하고 결정해.</p></header>
<main>
  <div class="toprow">
    <div class="control"><label for="member">멤버</label><select id="member"></select></div>
    <div class="control"><label for="stage">현재 크랙 단계</label><select id="stage">
      <option value="profile">① 프로필 설정</option><option value="story">② 스토리 설정</option><option value="start">③ 시작 설정</option>
    </select></div>
  </div>
  <div id="fields"></div>
  <div class="buttons"><button id="openCrack" type="button" class="secondary">크랙 열기</button><button id="fill" type="button" class="primary">현재 단계 자동입력</button></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="hint">① PC 크롬에서 크랙에 로그인 → ② 스토리 만들기 → ③ 이 확장 프로그램에서 멤버와 단계를 선택 → ④ 자동입력 버튼. 다음 단계로 넘어갈 때 다시 눌러줘.<br>실제 페이지 구조에 따라 일부 칸은 인식되지 않을 수 있어. 이미지 업로드와 최종 등록은 직접 진행해.</div>
</main>
<script src="popup.js"></script>
</body>
</html>
